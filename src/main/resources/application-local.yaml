spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ark}
    username: ${DB_USERNAME:ark}
    password: ${DB_PASSWORD:ark}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ark:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:ark-documents}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  auth:
    # 로컬 데모 전용 만능 인증코드 — 이 값이면 OTP 요청 없이 아무 이메일이나 로그인.
    # local 프로파일에만 존재(dev/stg/prd 미설정) → 운영에서는 비활성.
    otp-master-code: "000000"
