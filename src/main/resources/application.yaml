spring:
  application:
    name: ark-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true

springdoc:
  packages-to-scan: com.sentbe.bizplatform.ark
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ark:
  auth:
    otp-ttl-seconds: 300
    session-hours: 72
    staff-session-hours: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  config: classpath:log4j2.xml
