spring:
  application:
    name: ark-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # PI-240: 기본 1MB → 프론트 업로드 정책(10MB)과 정합. 1MB 초과 파일이
      # multipart 파싱 단계에서 거부돼 net::ERR_FAILED 나던 문제 해소.
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  packages-to-scan: com.sentbe.bizplatform.ark
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ark:
  auth:
    otp-ttl-seconds: 300
    session-hours: 72
    staff-session-hours: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  config: classpath:log4j2.xml
